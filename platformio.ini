; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = atmelsam
board = mkrzero
framework = arduino
lib_deps = 

[platformio]
description = Arduino MKR Zero based Garage Door Controller
default_envs = mkrzero-release

[env:mkrzero-debug]
build_type = debug
monitor_speed = 9600
extra_scripts = post:delay_serial_monitor.py
lib_deps = 
	arduino-libraries/Ethernet@^2.0.0
	https://github.com/hideakitai/MQTTPubSubClient.git#af7007b9b7366292c0b98a4dac99f0f293207661
	javos65/WDTZero@^1.3.0
	bblanchon/ArduinoJson@^6.18.5
	olikraus/U8g2@^2.32.7
	adafruit/Adafruit MCP23008 library@^2.1.0

[env:mkrzero-release]
build_type = release
monitor_speed = 9600
extra_scripts = post:delay_serial_monitor.py
lib_deps = 
	arduino-libraries/Ethernet@^2.0.0
	arduino-libraries/ArduinoMqttClient@^0.1.5
	https://github.com/hideakitai/MQTTPubSubClient.git#af7007b9b7366292c0b98a4dac99f0f293207661
	javos65/WDTZero@^1.3.0
	bblanchon/ArduinoJson@^6.18.5
	olikraus/U8g2@^2.32.7
	adafruit/Adafruit MCP23008 library@^2.1.0
